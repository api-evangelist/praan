name: Praan
description: 'Praan (Praan Climate Technologies) is a deep-tech climate startup working to
  democratize access to clean, healthy air and to rebuild the atmosphere by capturing air
  pollution and greenhouse gases with novel filterless technology. Its products include HIVE,
  an air-purification device for homes and commercial spaces paired with a companion mobile
  application, and MK II, an air-purification system for industrial environments. Praan is
  backed by Prosus Ventures. This profile was surfaced as a portfolio-company lead and
  enriched through the API Evangelist pipeline; as of this pass Praan publishes a consumer
  hardware and mobile-app surface but no public developer API, SDK, or documentation.'
